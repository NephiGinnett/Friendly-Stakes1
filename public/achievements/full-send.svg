<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#1e1b4b"/>
  <!-- Stars -->
  <circle cx="18" cy="18" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="82" cy="14" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="14" cy="72" r="1" fill="white" opacity="0.4"/>
  <circle cx="87" cy="68" r="1.3" fill="white" opacity="0.6"/>
  <circle cx="75" cy="82" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="25" cy="85" r="1" fill="white" opacity="0.5"/>
  <!-- Rocket flame -->
  <ellipse cx="68" cy="55" rx="5" ry="8" fill="#f97316" opacity="0.9"/>
  <ellipse cx="68" cy="58" rx="3" ry="5" fill="#fbbf24"/>
  <!-- Rocket body -->
  <rect x="62" y="25" width="12" height="28" rx="6" fill="#e2e8f0"/>
  <!-- Rocket tip -->
  <polygon points="68,12 62,25 74,25" fill="#a78bfa"/>
  <!-- Rocket window -->
  <circle cx="68" cy="33" r="4" fill="#7c3aed"/>
  <circle cx="68" cy="33" r="2.5" fill="#a78bfa"/>
  <!-- Rocket fins -->
  <polygon points="62,48 55,56 62,52" fill="#cbd5e1"/>
  <polygon points="74,48 81,56 74,52" fill="#cbd5e1"/>
  <!-- Penguin body -->
  <ellipse cx="36" cy="66" rx="16" ry="20" fill="#1f2937"/>
  <!-- Penguin white belly -->
  <ellipse cx="36" cy="68" rx="9" ry="13" fill="white"/>
  <!-- Penguin head -->
  <circle cx="36" cy="44" r="13" fill="#1f2937"/>
  <!-- Penguin eyes -->
  <circle cx="31" cy="41" r="2.8" fill="white"/>
  <circle cx="41" cy="41" r="2.8" fill="white"/>
  <circle cx="31.8" cy="41.5" r="1.5" fill="#111"/>
  <circle cx="41.8" cy="41.5" r="1.5" fill="#111"/>
  <!-- Beak -->
  <ellipse cx="36" cy="48" rx="3.5" ry="2.2" fill="#f97316"/>
  <!-- Wings -->
  <ellipse cx="22" cy="64" rx="6" ry="10" fill="#374151" transform="rotate(-15 22 64)"/>
  <ellipse cx="50" cy="64" rx="6" ry="10" fill="#374151" transform="rotate(15 50 64)"/>
  <!-- 40km badge -->
  <rect x="8" y="86" width="84" height="10" rx="5" fill="#7c3aed" opacity="0.8"/>
  <text x="50" y="93.5" font-size="6.5" text-anchor="middle" fill="white" font-family="monospace" font-weight="bold">40 KM · #1</text>
</svg>
